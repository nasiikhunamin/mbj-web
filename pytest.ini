[pytest]
testpaths = rag_service/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --cov=rag_service.chunkers
    --cov=rag_service.retrievers
    --cov=rag_service.rerankers
    --cov-report=term-missing
    --cov-fail-under=70
