name: Deploy ke Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      DEPLOY_PATH: /home/u673275576/laravel_app
      PUBLIC_PATH: /home/u673275576/domains/mbjindonesia.co.id/public_html
      PHP_BIN: php

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, fileinfo, pdo, pdo_mysql, openssl, tokenizer, curl, zip
          tools: composer:v2
          coverage: none

      - name: Composer install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets (jika ada)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build
          else
            echo "package.json tidak ditemukan, melewati build NPM."
          fi

      - name: Siapkan SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Preflight check (pastikan server siap)
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e

            command -v rsync >/dev/null || { echo 'ERROR: rsync tidak tersedia di server'; exit 1; }
            test -d '$DEPLOY_PATH'         || { echo 'ERROR: DEPLOY_PATH tidak ada'; exit 1; }
            test -d '$PUBLIC_PATH'         || { echo 'ERROR: PUBLIC_PATH tidak ada'; exit 1; }
            test -f '$DEPLOY_PATH/.env'    || { echo 'ERROR: .env belum ada di laravel_app'; exit 1; }
            test -d '$DEPLOY_PATH/storage' || { echo 'ERROR: storage tidak ada'; exit 1; }
            test -w '$DEPLOY_PATH/storage' || { echo 'ERROR: storage tidak writable'; exit 1; }

            $PHP_BIN -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);' \
              || { echo 'ERROR: PHP CLI minimal 8.1'; exit 1; }
            echo -n 'PHP CLI: '; $PHP_BIN -v | head -n 1
          "

      - name: Upload aplikasi
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='storage/' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Clear cache, migrate, dan cache ulang
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            chmod -R ug+rwX storage bootstrap/cache
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan view:cache
          "

      - name: Sinkronkan public ke public_html
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e

            mkdir -p '$PUBLIC_PATH/asset'
            rsync -a --delete '$DEPLOY_PATH/public/asset/' '$PUBLIC_PATH/asset/'

            rsync -a --exclude='asset/' '$DEPLOY_PATH/public/' '$PUBLIC_PATH/'
          "

      - name: Buat index.php untuk public_html
        run: |
          sed \
            -e "s|__DIR__.'/../vendor/autoload.php'|'$DEPLOY_PATH/vendor/autoload.php'|" \
            -e "s|__DIR__.'/../bootstrap/app.php'|'$DEPLOY_PATH/bootstrap/app.php'|" \
            -e "s|__DIR__.'/../storage/framework/maintenance.php'|'$DEPLOY_PATH/storage/framework/maintenance.php'|" \
            public/index.php > "$RUNNER_TEMP/index.php"

          grep -q "'$DEPLOY_PATH/vendor/autoload.php'" "$RUNNER_TEMP/index.php" \
            || { echo 'ERROR: pola path di public/index.php berubah, sed gagal'; exit 1; }

          php -l "$RUNNER_TEMP/index.php"

      - name: Upload index.php ke public_html
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            "$RUNNER_TEMP/index.php" \
            "$SSH_USER@$SSH_HOST:$PUBLIC_PATH/index.php"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "$PHP_BIN -l '$PUBLIC_PATH/index.php'"

      - name: Verifikasi hasil deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            test -f '$PUBLIC_PATH/index.php'   || { echo 'ERROR: index.php tidak ada'; exit 1; }
            test -f '$PUBLIC_PATH/.htaccess'   || { echo 'ERROR: .htaccess tidak ada'; exit 1; }
            test -d '$PUBLIC_PATH/asset/img'   || { echo 'ERROR: folder asset/img tidak ada'; exit 1; }
            grep -q 'laravel_app/vendor/autoload.php' '$PUBLIC_PATH/index.php' \
              || { echo 'ERROR: index.php masih memakai path relatif'; exit 1; }
            echo 'Deploy selesai: file utama sudah terpasang.'
          "
